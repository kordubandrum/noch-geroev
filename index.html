  <script type="importmap">{"imports":{"three":"./vendor/three/build/three.module.min.js","three/addons/":"./vendor/three/addons/"}}</script>

<body>
  <main id="app" aria-live="polite"></main>
  <div id="overlay" hidden></div>
  <div id="toast" role="status" hidden></div>
  <noscript>Для игры нужен включённый JavaScript.</noscript>
  <script>
    // Журнал ошибок для iPhone: виден в «Настройках», там же кнопка «Скопировать»
    (function () {
      function log(t) {
        try {
          var k = 'igra.errors', l = JSON.parse(localStorage.getItem(k) || '[]');
          l.push(new Date().toLocaleString('ru-RU') + ' | ' + t);
          localStorage.setItem(k, JSON.stringify(l.slice(-20)));
        } catch (e) {}
      }
      addEventListener('error', function (e) { log(e.message + ' @ ' + String(e.filename || '').split('/').pop() + ':' + e.lineno); });
      addEventListener('unhandledrejection', function (e) { log('promise: ' + ((e.reason && e.reason.message) || e.reason)); });
    })();
  </script>
  <script type="module" src="js/main.js?v=3"></script>
</body>
</html>
